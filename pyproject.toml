[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereom"
version = "0.1.0"
description = "Quantitative 3D structural analysis of cellular microstructures (stereom networks) - high-performance Python port of the MATLAB reference toolbox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "networkx>=3.2",
    "tifffile>=2023.7.10",
    "joblib>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
yaml = ["pyyaml>=6.0"]
parquet = ["pyarrow>=14.0"]
hpc = ["mpi4py>=3.1"]
mesh = ["trimesh>=4.0", "shapely>=2.0", "pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["stereom[viz,yaml,parquet,hpc,mesh,dev]"]

[project.scripts]
stereom = "stereom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavier end-to-end tests (rasterize + skeletonize a lattice volume)"]
